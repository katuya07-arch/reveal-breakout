<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#120d1a">
<title>Reveal Breakout</title>

<meta property="og:type" content="website">
<meta property="og:url" content="https://katuya07-arch.github.io/reveal-breakout/">
<meta property="og:title" content="Reveal Breakout｜絵を解放するブロック崩し">
<meta property="og:description" content="ブロックを崩して絵を解放しよう。スマホでそのまま遊べる無料ゲーム。">
<meta property="og:image" content="https://katuya07-arch.github.io/reveal-breakout/ogp.jpg">
<meta name="twitter:card" content="summary_large_image">
<!--
  ===== 広告タグはここに貼る =====
  例) AdSense H5ゲーム広告（Ad Placement API）:
  <script async data-ad-frequency-hint="30s" src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>
  <script>window.adsbygoogle = window.adsbygoogle || []; var adBreak = adConfig = function(o) { adsbygoogle.push(o); }</script>
-->
<style>
  :root { --bg:#120d1a; --panel:#1f1730; --line:#2c2340; --accent:#ff5c9a; --text:#f4eefc; --muted:#a99bc0; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; background:var(--bg); color:var(--text); overflow:hidden; touch-action:none;
    font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
  #app { display:flex; flex-direction:column; height:100vh; height:100dvh; padding-top:env(safe-area-inset-top); }
  #stage-wrap { flex:1; position:relative; display:flex; align-items:center; justify-content:center; min-height:0; }
  canvas { display:block; touch-action:none; }
  #canvas-box { position:relative; }
  #btn-mute { position:absolute; top:0; right:0; width:11%; height:6.25%; min-width:0; padding:0; font-size:16px;
    background:transparent; border:0; border-radius:0; }
  .credit { font-size:11px !important; }

  /* 下部バナー：プレイ領域の外。パドルと距離を取って誤タップを防ぐ */
  #ad-banner { flex:0 0 auto; display:flex; justify-content:center; align-items:center; margin-top:10px;
    padding:8px 0 calc(8px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); background:#0c0912; }
  .ad-placeholder { width:320px; height:50px; border:1px dashed #4a3d63; color:var(--muted); font-size:12px;
    display:flex; align-items:center; justify-content:center; }
  .ad-rect { width:300px; height:250px; max-width:100%; }
  /* Android アプリ版ではWeb用の広告枠を出さない（アプリはAdMobで別途） */
  .in-app #ad-banner, .in-app #ad-rect, .in-app #btn-share { display:none; }
  /* 広告タグを入れるまで（ADS_ENABLED=false）は枠ごと隠す */
  .no-ads #ad-banner, .no-ads #ad-rect { display:none; }
  /* 録画用デモモード（?demo）では広告とボタン類を隠す */
  .demo #ad-banner, .demo #btn-mute, .demo #btn-gallery { display:none; }
  #btn-share { background:#000; border:1px solid #444; }

  .overlay { position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; background:rgba(10,7,16,.82); text-align:center; padding:20px; }
  .overlay.show { display:flex; }
  .overlay h1 { font-size:30px; letter-spacing:.04em; }
  .overlay p { color:var(--muted); font-size:14px; line-height:1.6; }
  button { font:inherit; font-weight:700; font-size:16px; color:#fff; background:var(--accent); border:0; border-radius:999px;
    padding:12px 28px; min-width:220px; cursor:pointer; }
  button.sub { background:transparent; border:1px solid #5a4a78; }

  .grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; width:min(100%, 360px); }
  .grid > * { aspect-ratio:9/11; border-radius:8px; overflow:hidden; background:var(--panel); }
  .grid img { width:100%; height:100%; object-fit:cover; display:block; }
  .grid .locked { display:flex; align-items:center; justify-content:center; color:#5a4a78; font-size:28px; font-weight:700; }

  #viewer { position:fixed; inset:0; background:#000; display:none; align-items:center; justify-content:center; z-index:10; }
  #viewer.show { display:flex; }
  #viewer img { max-width:100%; max-height:100%; object-fit:contain; }
</style>
</head>
<body>
<div id="app">
  <div id="stage-wrap">
    <div id="canvas-box">
      <canvas id="game"></canvas>
      <button id="btn-mute" aria-label="サウンド切替">🔊</button>
    </div>

    <div class="overlay show" id="ov-title">
      <h1>Reveal Breakout</h1>
      <p>ブロックを壊して絵を解放しよう<br>スワイプでパドル移動 / タップで発射</p>
      <button id="btn-start">スタート</button>
      <button class="sub" id="btn-gallery">ギャラリー</button>
      <p class="credit" id="credit"></p>
    </div>

    <div class="overlay" id="ov-inter">
      <h1 id="inter-title">STAGE CLEAR</h1>
      <p id="inter-score"></p>
      <!-- ステージ間の広告枠（ディスプレイ広告 or アフィリエイトバナー 300x250） -->
      <div class="ad-placeholder ad-rect" id="ad-rect">広告枠 300×250</div>
      <button id="btn-next">次のステージへ</button>
      <button id="btn-share">Xでシェア</button>
    </div>

    <div class="overlay" id="ov-over">
      <h1>GAME OVER</h1>
      <p id="over-score"></p>
      <button id="btn-continue">広告を見てコンティニュー</button>
      <button class="sub" id="btn-title">タイトルへ</button>
    </div>

    <div class="overlay" id="ov-gallery">
      <h1>ギャラリー</h1>
      <div class="grid" id="gallery-grid"></div>
      <button class="sub" id="btn-gallery-close">閉じる</button>
    </div>
  </div>

  <!-- 常設バナー枠 320x50 -->
  <div id="ad-banner"><div class="ad-placeholder">広告枠 320×50</div></div>
</div>

<div id="viewer"><img alt=""></div>

<script>
(() => {
'use strict';

// ===== 設定 =====
// ステージ順に画像を並べる（後のステージほど解放のご褒美が大きくなる構成）。
// 推奨サイズ 720×880（9:11）。ファイルが無いと仮画像で動く。
const STAGES = [
  { src: 'images/stage1.jpg' },
  { src: 'images/stage2.jpg' },
  { src: 'images/stage3.jpg' },
  { src: 'images/stage4.jpg' },
  { src: 'images/stage5.jpg' },
];

const W = 360, H = 640;
const HUD_H = 40;
const AREA = { x: 0, y: HUD_H, w: 360, h: 440 };
const COLS = 8, ROWS = 11;
const BW = AREA.w / COLS, BH = AREA.h / ROWS;
const PADDLE_Y = H - 60, PADDLE_H = 12, PADDLE_W = 72, PADDLE_W_WIDE = 116;
const BALL_R = 6;
const MAX_BALLS = 12;
const ITEM_CHANCE = 0.12;

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const wrap = document.getElementById('stage-wrap');
const $ = id => document.getElementById(id);
const IN_APP = !!window.AndroidApp;
const ADS_ENABLED = false; // 広告タグを <head> に貼ったら true にする
if (!ADS_ENABLED) document.documentElement.classList.add('no-ads');
const DEMO = new URLSearchParams(location.search).has('demo');
const SITE_URL = 'https://katuya07-arch.github.io/reveal-breakout/';
if (DEMO) {
  document.documentElement.classList.add('demo');
  $('btn-start').textContent = 'デモ開始（画面録画用）';
}
if (IN_APP) document.documentElement.classList.add('in-app');
if (IN_APP || !ADS_ENABLED) $('btn-continue').textContent = 'コンティニュー';

function resize() {
  const r = wrap.getBoundingClientRect();
  const scale = Math.min(r.width / W, r.height / H);
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  canvas.style.width = W * scale + 'px';
  canvas.style.height = H * scale + 'px';
  canvas.width = Math.round(W * scale * dpr);
  canvas.height = Math.round(H * scale * dpr);
  ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
}
window.addEventListener('resize', resize);

// ===== 画像 =====
function makePlaceholder(i) {
  const c = document.createElement('canvas');
  c.width = 720; c.height = 880;
  const g = c.getContext('2d');
  const hue = (i * 57 + 300) % 360;
  const grad = g.createLinearGradient(0, 0, 720, 880);
  grad.addColorStop(0, `hsl(${hue},70%,58%)`);
  grad.addColorStop(1, `hsl(${(hue + 60) % 360},70%,28%)`);
  g.fillStyle = grad;
  g.fillRect(0, 0, 720, 880);
  g.fillStyle = 'rgba(255,255,255,.92)';
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.font = 'bold 80px sans-serif';
  g.fillText('STAGE ' + (i + 1), 360, 400);
  g.font = '30px sans-serif';
  g.fillText(`images/stage${i + 1}.jpg を置いてね`, 360, 500);
  return c;
}

STAGES.forEach((s, i) => {
  s.img = makePlaceholder(i);
  s.url = s.img.toDataURL('image/jpeg', 0.8);
  const im = new Image();
  im.onload = () => { s.img = im; s.url = s.src; };
  im.src = s.src;
});

function imgSize(img) {
  return [img.naturalWidth || img.width, img.naturalHeight || img.height];
}
function drawCover(img, x, y, w, h) {
  const [iw, ih] = imgSize(img);
  const s = Math.max(w / iw, h / ih);
  const sw = w / s, sh = h / s;
  ctx.drawImage(img, (iw - sw) / 2, (ih - sh) / 2, sw, sh, x, y, w, h);
}
function drawContain(img, x, y, w, h) {
  const [iw, ih] = imgSize(img);
  const s = Math.min(w / iw, h / ih);
  const dw = iw * s, dh = ih * s;
  ctx.drawImage(img, x + (w - dw) / 2, y + (h - dh) / 2, dw, dh);
}

// ===== 保存（ギャラリー解放数） =====
function getUnlocked() {
  try { return +localStorage.getItem('rb_unlocked') || 0; } catch { return 0; }
}
function unlock(n) {
  try { if (n > getUnlocked()) localStorage.setItem('rb_unlocked', String(n)); } catch {}
}

// ===== 広告 =====
// Ad Placement API（adBreak）が読み込まれていれば使う。無ければ何もしない。
function showInterstitialAd() {
  if (typeof window.adBreak === 'function') window.adBreak({ type: 'next', name: 'stage-clear' });
}
function showRewardedAd(onDone) {
  if (typeof window.adBreak !== 'function') { onDone(); return; }
  window.adBreak({
    type: 'reward',
    name: 'continue',
    beforeReward: showAdFn => showAdFn(),
    adDismissed: () => {},
    adViewed: () => {},
    adBreakDone: () => onDone(),
  });
}

// ===== サウンド =====
// audio/bgm.mp3 を置けばそれをループ再生。無ければ自動生成のチップチューンを流す。
// 素材サイトの規約でクレジット表記が必要なら BGM_CREDIT に書く（タイトル画面に表示）。
const BGM_SRC = 'audio/bgm.mp3';
const BGM_CREDIT = 'BGM：甘茶の音楽工房（https://amachamusic.chagasi.com/）';

const sound = (() => {
  let ac = null, master = null, muted = false;
  try { muted = localStorage.getItem('rb_muted') === '1'; } catch {}

  const file = new Audio();
  let fileFailed = false;
  file.loop = true;
  file.preload = 'auto';
  file.volume = 0.5;
  file.muted = muted;
  file.addEventListener('error', () => { fileFailed = true; }, { once: true });
  file.src = BGM_SRC;

  const STEP = 60 / 132 / 4; // 16分音符
  const BASS = [45, 41, 48, 43];                                  // Am F C G
  const CHORDS = [[57, 60, 64], [53, 57, 60], [60, 64, 67], [55, 59, 62]];
  const MEL = [
    76, 0, 74, 72, 74, 0, 76, 0,
    77, 0, 76, 74, 72, 0, 69, 0,
    72, 0, 74, 76, 79, 0, 76, 0,
    74, 0, 72, 71, 74, 0, 0, 0,
  ];
  const TRANSPOSE = [0, 2, -2, 3, 5];
  let timer = null, nextT = 0, stepI = 0, transpose = 0;

  const midi = n => 440 * Math.pow(2, (n - 69) / 12);

  function ensure() {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      ac = new AC();
      master = ac.createGain();
      master.gain.value = muted ? 0 : 0.5;
      master.connect(ac.destination);
    }
    if (ac.state === 'suspended') ac.resume();
    return true;
  }

  function tone(freq, t, dur, type, vol) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g);
    g.connect(master);
    o.start(t);
    o.stop(t + dur + 0.02);
  }

  function kick(t) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.setValueAtTime(150, t);
    o.frequency.exponentialRampToValueAtTime(40, t + 0.12);
    g.gain.setValueAtTime(0.5, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
    o.connect(g);
    g.connect(master);
    o.start(t);
    o.stop(t + 0.16);
  }

  function scheduleStep(i, t) {
    const bar = Math.floor(i / 16) % 4, s = i % 16, ch = CHORDS[bar];
    if (s % 4 === 0) kick(t);
    if (s % 2 === 0) tone(midi(BASS[bar] + (s % 4 === 2 ? 12 : 0) + transpose), t, STEP * 1.8, 'triangle', 0.35);
    tone(midi([ch[0], ch[1], ch[2], ch[0] + 12][s % 4] + transpose), t, STEP * 0.9, 'square', 0.04);
    if (s % 2 === 0) {
      const n = MEL[bar * 8 + s / 2];
      if (n) tone(midi(n + transpose), t, STEP * 1.9, 'square', 0.08);
    }
  }

  function tick() {
    if (nextT < ac.currentTime - 0.05) nextT = ac.currentTime + 0.05; // バックグラウンド復帰時の取りこぼし対策
    while (nextT < ac.currentTime + 0.12) {
      scheduleStep(stepI++, nextT);
      nextT += STEP;
    }
  }

  function playSynth(stage) {
    if (!ensure()) return;
    transpose = TRANSPOSE[stage % TRANSPOSE.length];
    stepI = 0;
    nextT = ac.currentTime + 0.05;
    timer = setInterval(tick, 25);
  }

  function playBgm(stage) {
    stopBgm();
    ensure(); // ユーザー操作中に AudioContext を起こしておく（効果音用）
    if (fileFailed) { playSynth(stage); return; }
    file.currentTime = 0;
    file.play().catch(() => { fileFailed = true; playSynth(stage); });
  }

  function stopBgm() {
    file.pause();
    clearInterval(timer);
    timer = null;
  }

  function se(name, n = 0) {
    if (muted || !ensure()) return;
    const t = ac.currentTime;
    if (name === 'paddle') tone(440, t, 0.06, 'triangle', 0.25);
    else if (name === 'hit') tone(1200, t, 0.05, 'square', 0.08);
    else if (name === 'break') {
      const scale = [0, 2, 4, 7, 9], k = Math.min(n - 1, 10);
      tone(midi(72 + scale[k % 5] + 12 * Math.floor(k / 5)), t, 0.12, 'square', 0.1);
    } else if (name === 'item') [72, 76, 79, 84].forEach((m, i) => tone(midi(m), t + i * 0.05, 0.1, 'square', 0.1));
    else if (name === 'lose') [67, 63, 58].forEach((m, i) => tone(midi(m), t + i * 0.12, 0.2, 'sawtooth', 0.12));
    else if (name === 'clear') [72, 76, 79, 84, 79, 84].forEach((m, i) => tone(midi(m), t + i * 0.1, 0.25, 'square', 0.12));
  }

  function toggleMute() {
    muted = !muted;
    file.muted = muted;
    if (master) master.gain.value = muted ? 0 : 0.5;
    try { localStorage.setItem('rb_muted', muted ? '1' : '0'); } catch {}
    return muted;
  }

  // タブ切替やアプリのバックグラウンド化で音を止める
  let resumeFile = false;
  function setHidden(hidden) {
    if (hidden) {
      if (ac) ac.suspend();
      if (!file.paused) { file.pause(); resumeFile = true; }
    } else {
      if (ac) ac.resume();
      if (resumeFile) { file.play().catch(() => {}); resumeFile = false; }
    }
  }
  document.addEventListener('visibilitychange', () => setHidden(document.hidden));
  window.__appPause = () => setHidden(true);
  window.__appResume = () => setHidden(false);

  return { playBgm, stopBgm, se, toggleMute, isMuted: () => muted };
})();

$('btn-mute').textContent = sound.isMuted() ? '🔇' : '🔊';
$('btn-mute').addEventListener('click', () => {
  $('btn-mute').textContent = sound.toggleMute() ? '🔇' : '🔊';
});
$('credit').textContent = BGM_CREDIT;

// ===== ゲーム状態 =====
let state = 'title'; // title | ready | play | reveal | inter | over
let stageIdx = 0, score = 0, lives = 3;
let blocks = [], blocksLeft = 0, blocksTotal = 0;
let balls = [], items = [], particles = [];
let slowT = 0, revealT = 0, time = 0, combo = 0, demoT = 0;
const paddle = { x: W / 2, w: PADDLE_W, targetX: W / 2, wideT: 0 };

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function buildStage(i) {
  blocks = [];
  const hue0 = (i * 57 + 300) % 360;
  const hardRate = Math.min(0.08 + i * 0.08, 0.45);
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      blocks.push({
        c, r, x: AREA.x + c * BW, y: AREA.y + r * BH,
        hp: Math.random() < hardRate ? 2 : 1,
        alive: true,
        hue: (hue0 + r * 9) % 360,
      });
    }
  }
  blocksLeft = blocksTotal = blocks.length;
}

function speed() {
  return (330 + stageIdx * 30) * (slowT > 0 ? 0.65 : 1);
}

function resetBall() {
  balls = [{ x: paddle.x, y: PADDLE_Y - BALL_R - 1, dx: 0, dy: -1, stuck: true }];
  items = [];
  paddle.wideT = 0;
  slowT = 0;
  state = 'ready';
}

function launch() {
  if (DEMO) {
    const b = balls[0];
    balls.push({ ...b }, { ...b });
  }
  for (const b of balls) {
    if (!b.stuck) continue;
    const a = (Math.random() - 0.5) * 0.8;
    b.dx = Math.sin(a);
    b.dy = -Math.cos(a);
    b.stuck = false;
  }
  state = 'play';
}

function fixAngle(b) {
  if (Math.abs(b.dy) < 0.3) {
    b.dy = (b.dy < 0 ? -1 : 1) * 0.3;
    b.dx = (b.dx < 0 ? -1 : 1) * Math.sqrt(1 - 0.09);
  }
}

function blockAt(c, r) {
  if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return null;
  const bl = blocks[r * COLS + c];
  return bl.alive ? bl : null;
}

function hitBlocks(b) {
  const c0 = Math.floor((b.x - BALL_R - AREA.x) / BW), c1 = Math.floor((b.x + BALL_R - AREA.x) / BW);
  const r0 = Math.floor((b.y - BALL_R - AREA.y) / BH), r1 = Math.floor((b.y + BALL_R - AREA.y) / BH);
  let best = null, bestD = Infinity;
  for (let r = r0; r <= r1; r++) {
    for (let c = c0; c <= c1; c++) {
      const bl = blockAt(c, r);
      if (!bl) continue;
      const nx = clamp(b.x, bl.x, bl.x + BW), ny = clamp(b.y, bl.y, bl.y + BH);
      const d = (b.x - nx) ** 2 + (b.y - ny) ** 2;
      if (d <= BALL_R * BALL_R && d < bestD) { bestD = d; best = bl; }
    }
  }
  if (!best) return;

  const cx = best.x + BW / 2, cy = best.y + BH / 2;
  const ox = BW / 2 + BALL_R - Math.abs(b.x - cx);
  const oy = BH / 2 + BALL_R - Math.abs(b.y - cy);
  const sx = b.x < cx ? -1 : 1, sy = b.y < cy ? -1 : 1;
  // 隣のブロックが生きている面では横反射しない（継ぎ目で変な跳ね方をしないように）
  let horizontal = ox < oy;
  if (horizontal && blockAt(best.c + sx, best.r)) horizontal = false;
  else if (!horizontal && blockAt(best.c, best.r + sy) && !blockAt(best.c + sx, best.r)) horizontal = true;

  if (horizontal) { b.dx = sx * Math.abs(b.dx); b.x += sx * Math.max(0, ox); }
  else { b.dy = sy * Math.abs(b.dy); b.y += sy * Math.max(0, oy); }
  fixAngle(b);
  damage(best);
}

function damage(bl) {
  bl.hp--;
  if (bl.hp > 0) {
    score += 5;
    sound.se('hit');
    spawnParticles(bl, 4);
    return;
  }
  bl.alive = false;
  blocksLeft--;
  score += 10 + stageIdx * 5;
  combo++;
  sound.se('break', combo);
  spawnParticles(bl, 10);
  if (Math.random() < ITEM_CHANCE) {
    const types = ['W', 'M', 'S'];
    items.push({ x: bl.x + BW / 2, y: bl.y + BH / 2, type: types[Math.floor(Math.random() * types.length)] });
  }
}

function applyItem(type) {
  sound.se('item');
  if (type === 'W') paddle.wideT = 12;
  else if (type === 'S') slowT = 8;
  else if (type === 'M') {
    const add = [];
    for (const b of balls) {
      if (b.stuck) continue;
      for (const a of [-0.4, 0.4]) {
        if (balls.length + add.length >= MAX_BALLS) break;
        const cos = Math.cos(a), sin = Math.sin(a);
        const nb = { x: b.x, y: b.y, dx: b.dx * cos - b.dy * sin, dy: b.dx * sin + b.dy * cos, stuck: false };
        fixAngle(nb);
        add.push(nb);
      }
    }
    balls.push(...add);
  }
}

function spawnParticles(bl, n) {
  for (let i = 0; i < n; i++) {
    particles.push({
      x: bl.x + Math.random() * BW, y: bl.y + Math.random() * BH,
      vx: (Math.random() - 0.5) * 220, vy: (Math.random() - 0.8) * 200,
      life: 0.5 + Math.random() * 0.4, size: 3 + Math.random() * 4,
      color: `hsl(${bl.hue},70%,${55 + Math.random() * 20}%)`,
    });
  }
}

function update(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.vy += 600 * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
  }
  if (state === 'reveal') {
    revealT += dt;
    if (DEMO && revealT > 2.5) demoNextStage();
  }
  if (state !== 'play' && state !== 'ready') return;

  const tw = paddle.wideT > 0 ? PADDLE_W_WIDE : PADDLE_W;
  paddle.w += (tw - paddle.w) * Math.min(1, dt * 10);
  paddle.x = clamp(paddle.targetX, paddle.w / 2, W - paddle.w / 2);

  if (state === 'ready') {
    for (const b of balls) { b.x = paddle.x; b.y = PADDLE_Y - BALL_R - 1; }
    if (DEMO && (demoT += dt) > 0.6) { demoT = 0; launch(); }
    return;
  }
  if (DEMO) demoPaddle();

  paddle.wideT = Math.max(0, paddle.wideT - dt);
  slowT = Math.max(0, slowT - dt);

  const dist = speed() * dt;
  const n = Math.max(1, Math.ceil(dist / 3));
  const step = dist / n;
  for (let i = balls.length - 1; i >= 0; i--) {
    const b = balls[i];
    for (let k = 0; k < n; k++) {
      b.x += b.dx * step;
      b.y += b.dy * step;
      if (b.x < BALL_R) { b.x = BALL_R; b.dx = Math.abs(b.dx); }
      else if (b.x > W - BALL_R) { b.x = W - BALL_R; b.dx = -Math.abs(b.dx); }
      if (b.y < AREA.y + BALL_R) { b.y = AREA.y + BALL_R; b.dy = Math.abs(b.dy); }

      if (b.dy > 0 && b.y + BALL_R >= PADDLE_Y && b.y - BALL_R <= PADDLE_Y + PADDLE_H &&
          Math.abs(b.x - paddle.x) <= paddle.w / 2 + BALL_R) {
        const t = clamp((b.x - paddle.x) / (paddle.w / 2), -1, 1);
        const a = t * 1.05; // 端で最大約60°
        b.dx = Math.sin(a);
        b.dy = -Math.cos(a);
        b.y = PADDLE_Y - BALL_R;
        combo = 0;
        sound.se('paddle');
      }

      if (b.y - BALL_R < AREA.y + AREA.h) hitBlocks(b);
    }
    if (b.y - BALL_R > H) balls.splice(i, 1);
  }

  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    it.y += 140 * dt;
    if (it.y + 8 >= PADDLE_Y && it.y - 8 <= PADDLE_Y + PADDLE_H && Math.abs(it.x - paddle.x) <= paddle.w / 2 + 14) {
      applyItem(it.type);
      items.splice(i, 1);
    } else if (it.y > H + 20) {
      items.splice(i, 1);
    }
  }

  if (blocksLeft === 0) { stageClear(); return; }
  if (!balls.length) {
    if (!DEMO) lives--;
    sound.se('lose');
    if (lives <= 0) gameOver();
    else resetBall();
  }
}

// ===== 描画 =====
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawBlock(bl) {
  const hard = bl.hp > 1;
  ctx.fillStyle = `hsl(${bl.hue},62%,${hard ? 36 : 54}%)`;
  ctx.fillRect(bl.x, bl.y, BW, BH);
  ctx.fillStyle = 'rgba(255,255,255,.28)';
  ctx.fillRect(bl.x, bl.y, BW, 3);
  ctx.fillStyle = 'rgba(0,0,0,.28)';
  ctx.fillRect(bl.x, bl.y + BH - 3, BW, 3);
  ctx.strokeStyle = 'rgba(0,0,0,.35)';
  ctx.lineWidth = 1;
  ctx.strokeRect(bl.x + 0.5, bl.y + 0.5, BW - 1, BH - 1);
  if (hard) {
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    ctx.beginPath();
    ctx.arc(bl.x + BW / 2, bl.y + BH / 2, 4, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawHUD() {
  ctx.fillStyle = '#1a1326';
  ctx.fillRect(0, 0, W, HUD_H);
  ctx.font = 'bold 14px system-ui,sans-serif';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#f4eefc';
  ctx.textAlign = 'left';
  ctx.fillText(`STAGE ${stageIdx + 1}/${STAGES.length}`, 10, 18);
  ctx.textAlign = 'center';
  ctx.fillText(String(score).padStart(6, '0'), W / 2, 18);
  ctx.textAlign = 'right';
  ctx.fillStyle = '#ff5c9a';
  ctx.fillText('♥'.repeat(Math.max(0, lives)), W - 42, 18);
  // 解放率バー
  const pct = blocksTotal ? 1 - blocksLeft / blocksTotal : 0;
  ctx.fillStyle = '#2c2340';
  ctx.fillRect(0, HUD_H - 4, W, 4);
  ctx.fillStyle = '#ff5c9a';
  ctx.fillRect(0, HUD_H - 4, W * pct, 4);
}

function drawPill(text, y) {
  ctx.font = 'bold 15px system-ui,sans-serif';
  const w = ctx.measureText(text).width + 32;
  ctx.fillStyle = 'rgba(0,0,0,.6)';
  rr(W / 2 - w / 2, y - 16, w, 32, 16);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, W / 2, y);
}

function draw() {
  ctx.fillStyle = '#120d1a';
  ctx.fillRect(0, 0, W, H);
  const st = STAGES[stageIdx];

  if (state === 'reveal' || state === 'inter') {
    drawContain(st.img, 0, 0, W, H);
    if (state === 'reveal' && revealT > 0.8 && Math.sin(time * 5) > -0.3) drawPill('タップで次へ', H - 36);
    drawParticles();
    return;
  }

  drawHUD();
  ctx.save();
  ctx.beginPath();
  ctx.rect(AREA.x, AREA.y, AREA.w, AREA.h);
  ctx.clip();
  drawCover(st.img, AREA.x, AREA.y, AREA.w, AREA.h);
  ctx.restore();
  for (const bl of blocks) if (bl.alive) drawBlock(bl);

  // パドル
  const g = ctx.createLinearGradient(0, PADDLE_Y, 0, PADDLE_Y + PADDLE_H);
  g.addColorStop(0, '#ff9cc2');
  g.addColorStop(1, '#e0407e');
  ctx.fillStyle = g;
  rr(paddle.x - paddle.w / 2, PADDLE_Y, paddle.w, PADDLE_H, 6);
  ctx.fill();

  // アイテム
  const itemColor = { W: '#4fc3f7', M: '#ffd54f', S: '#81c784' };
  ctx.font = 'bold 11px system-ui,sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const it of items) {
    ctx.fillStyle = itemColor[it.type];
    rr(it.x - 14, it.y - 8, 28, 16, 8);
    ctx.fill();
    ctx.fillStyle = '#1a1326';
    ctx.fillText(it.type, it.x, it.y + 1);
  }

  // ボール
  ctx.shadowColor = 'rgba(255,255,255,.8)';
  ctx.shadowBlur = 8;
  ctx.fillStyle = '#fff';
  for (const b of balls) {
    ctx.beginPath();
    ctx.arc(b.x, b.y, BALL_R, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.shadowBlur = 0;

  drawParticles();

  // 効果中の表示
  const fx = [];
  if (paddle.wideT > 0) fx.push(`WIDE ${Math.ceil(paddle.wideT)}`);
  if (slowT > 0) fx.push(`SLOW ${Math.ceil(slowT)}`);
  if (fx.length) {
    ctx.font = '11px system-ui,sans-serif';
    ctx.fillStyle = '#a99bc0';
    ctx.textAlign = 'right';
    ctx.fillText(fx.join('  '), W - 8, H - 14);
  }

  if (state === 'ready') drawPill('タップで発射', (AREA.y + AREA.h + PADDLE_Y) / 2);
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = Math.min(1, p.life * 2);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

// ===== 画面遷移 =====
function showOverlay(id) {
  document.querySelectorAll('.overlay').forEach(el => el.classList.toggle('show', el.id === id));
}

// デモ：一番下にある下降中のボールを追いかける（打ち返す位置を少し揺らして角度を散らす）
function demoPaddle() {
  let target = null;
  for (const b of balls) if (b.dy > 0 && (!target || b.y > target.y)) target = b;
  if (!target) return;
  paddle.targetX = target.x + Math.sin(time * 1.7) * paddle.w * 0.3;
}

function demoNextStage() {
  stageIdx = (stageIdx + 1) % STAGES.length;
  buildStage(stageIdx);
  resetBall();
  sound.playBgm(stageIdx);
}

function startGame() {
  stageIdx = 0; score = 0; lives = 3;
  buildStage(0);
  resetBall();
  showOverlay(null);
  sound.playBgm(0);
}

function stageClear() {
  state = 'reveal';
  revealT = 0;
  balls = []; items = [];
  unlock(stageIdx + 1);
  sound.stopBgm();
  sound.se('clear');
}

function toInter() {
  state = 'inter';
  const last = stageIdx === STAGES.length - 1;
  $('inter-title').textContent = last ? 'ALL CLEAR!' : `STAGE ${stageIdx + 1} CLEAR`;
  $('inter-score').textContent = `SCORE ${score}`;
  $('btn-next').textContent = last ? 'タイトルへ' : '次のステージへ';
  showOverlay('ov-inter');
  showInterstitialAd();
}

function nextStage() {
  if (stageIdx === STAGES.length - 1) { toTitle(); return; }
  stageIdx++;
  buildStage(stageIdx);
  resetBall();
  showOverlay(null);
  sound.playBgm(stageIdx);
}

function gameOver() {
  state = 'over';
  sound.stopBgm();
  $('over-score').textContent = `SCORE ${score}`;
  showOverlay('ov-over');
}

function toTitle() {
  state = 'title';
  stageIdx = 0;
  buildStage(0);
  balls = []; items = [];
  sound.stopBgm();
  showOverlay('ov-title');
}

function openGallery() {
  const grid = $('gallery-grid');
  grid.innerHTML = '';
  const n = getUnlocked();
  STAGES.forEach((s, i) => {
    if (i < n) {
      const img = document.createElement('img');
      img.src = s.url;
      img.alt = `STAGE ${i + 1}`;
      img.addEventListener('click', () => {
        $('viewer').querySelector('img').src = s.url;
        $('viewer').classList.add('show');
      });
      grid.appendChild(img);
    } else {
      const d = document.createElement('div');
      d.className = 'locked';
      d.textContent = '?';
      grid.appendChild(d);
    }
  });
  showOverlay('ov-gallery');
}

$('btn-start').addEventListener('click', startGame);
$('btn-gallery').addEventListener('click', openGallery);
$('btn-gallery-close').addEventListener('click', () => showOverlay('ov-title'));
$('btn-next').addEventListener('click', nextStage);
$('btn-share').addEventListener('click', () => {
  const text = `Reveal Breakout で STAGE ${stageIdx + 1} をクリア！ SCORE ${score}`;
  const url = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(SITE_URL)}&hashtags=RevealBreakout`;
  window.open(url, '_blank', 'noopener');
});
$('btn-title').addEventListener('click', toTitle);
$('btn-continue').addEventListener('click', () => {
  showRewardedAd(() => { lives = 3; resetBall(); showOverlay(null); sound.playBgm(stageIdx); });
});
$('viewer').addEventListener('click', () => $('viewer').classList.remove('show'));

// ===== 入力 =====
function toGameX(e) {
  const r = canvas.getBoundingClientRect();
  return (e.clientX - r.left) / r.width * W;
}
wrap.addEventListener('pointerdown', e => {
  if (e.target.closest('.overlay, button')) return;
  paddle.targetX = toGameX(e);
});
wrap.addEventListener('pointermove', e => {
  if (e.target.closest('.overlay, button')) return;
  if (state === 'play' || state === 'ready') paddle.targetX = toGameX(e);
});
wrap.addEventListener('pointerup', e => {
  if (e.target.closest('.overlay, button')) return;
  if (state === 'ready') launch();
  else if (state === 'reveal' && revealT > 0.8) toInter();
});
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') paddle.targetX = paddle.x - 30;
  else if (e.key === 'ArrowRight') paddle.targetX = paddle.x + 30;
  else if (e.key === ' ' && state === 'ready') launch();
});

// ===== ループ =====
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - lastT) / 1000);
  lastT = now;
  time += dt;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}

buildStage(0);
resize();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
